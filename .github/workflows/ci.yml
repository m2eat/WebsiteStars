name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Version tag to validate against the package
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Test and package Chrome extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      STARTS_LIVE_AGENT: '0'
      STARTS_LIVE_EMBEDDINGS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build release archive
        run: npm run zip
      - name: Verify package and generate checksum
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: python3 scripts/verify-package.py --tag "$RELEASE_TAG"
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser tests against packaged build
        run: npm run test:browser -- --reporter=list,html
      - name: Upload test report and traces
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .output/websitestars-*-chrome.zip
            .output/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
